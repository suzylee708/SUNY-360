<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="icon" href="images/icon.png">
<title>360 Viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="app" class="phase-logo">
  <div id="stage" role="img" aria-label="360 panorama. Drag to look around.">
    <div id="cam"></div>
  </div>
  <div id="spots"></div>
  <div id="shade"></div>

  <div id="logo-wrap" aria-hidden="true"><img id="logo" alt=""></div>
  <div id="loading" aria-hidden="true"><span></span></div>

  <div id="card-wrap">
    <section id="card" aria-labelledby="card-name">
      <div class="card-text">
        <p id="card-top"></p>
        <h1 id="card-name"></h1>
        <p id="card-sub"></p>
      </div>
      <button id="enter" type="button">Enter</button>
      <p id="rotate">Turn your phone sideways for a wider view.</p>
      <p id="ios-tip" hidden>For full screen, tap
        <svg aria-label="Share" role="img" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5v7.5M4.5 4L7 1.5 9.5 4"/><path d="M4 6.5H3v6h8v-6h-1"/></svg>
        Share, then Add to Home Screen.</p>
    </section>
  </div>

  <div id="tray" aria-label="All views">
    <div id="tray-list"></div>
  </div>

  <nav id="bar" aria-label="Views">
    <button id="prev" class="round" type="button" aria-label="Previous view">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l-6 6 6 6"/></svg>
    </button>
    <button id="title" type="button" aria-expanded="false" aria-controls="tray">
      <span id="title-group"></span>
      <span id="title-name"></span>
      <span id="title-count"></span>
      <svg id="chevron" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
    </button>
    <button id="next" class="round" type="button" aria-label="Next view">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l6 6-6 6"/></svg>
    </button>
  </nav>

  <div id="tools">
    <button id="replay" class="chip" type="button" aria-label="Replay intro" title="Replay intro">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9a5.5 5.5 0 1 0 1.6-3.9"/><path d="M3 2.5v3.2h3.2"/></svg>
    </button>
    <button id="home" class="chip" type="button" aria-label="Back to start" title="Back to start">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.2L9 3l6 5.2"/><path d="M4.8 7v7.5h8.4V7"/></svg>
    </button>
    <button id="motion" class="chip" type="button" aria-pressed="false" aria-label="Look around by moving your phone" title="Move your phone to look around">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2" width="7" height="14" rx="1.6"/><path d="M1.8 6.5c-.9 1.6-.9 3.4 0 5M16.2 6.5c.9 1.6.9 3.4 0 5"/></svg>
    </button>
    <button id="fullscreen" class="chip" type="button" aria-label="Full screen" title="Full screen">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5v-4h4M15.5 6.5v-4h-4M2.5 11.5v4h4M15.5 11.5v4h-4"/></svg>
    </button>
  </div>

  <div id="hint" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6.5"/><path d="M2.5 9c0 1.8 2.9 3.2 6.5 3.2s6.5-1.4 6.5-3.2"/></svg>
    <span id="hint-text">Drag to look around</span>
  </div>
</div>
<noscript><p style="color:#fff;font-family:sans-serif;padding:24px">This 360 viewer needs JavaScript.</p></noscript>
<script src="project.js"></script>
<script src="viewer.js"></script>
</body>
</html>
